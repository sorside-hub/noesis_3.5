<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8b5cf6" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#1e293b" stroke-width="4" />
  
  <!-- Neural Brain Nodes Logo -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Outer Orbital Rings -->
    <circle r="140" fill="none" stroke="url(#glow)" stroke-width="6" stroke-dasharray="16 12" opacity="0.6" />
    <circle r="100" fill="none" stroke="url(#glow)" stroke-width="4" stroke-dasharray="8 8" opacity="0.4" />
    
    <!-- Central Node Connections -->
    <path d="M-80,-40 L0,-100 L80,-40 L60,60 L-60,60 Z" fill="none" stroke="url(#glow)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M-80,-40 L60,60 M80,-40 L-60,60 M0,-100 L0,20 M-80,-40 L80,-40" fill="none" stroke="url(#glow)" stroke-width="4" opacity="0.7" />
    
    <!-- Nodes -->
    <circle cx="0" cy="-100" r="14" fill="#06b6d4" />
    <circle cx="-80" cy="-40" r="14" fill="#8b5cf6" />
    <circle cx="80" cy="-40" r="14" fill="#3b82f6" />
    <circle cx="-60" cy="60" r="14" fill="#a855f7" />
    <circle cx="60" cy="60" r="14" fill="#0ea5e9" />
    <circle cx="0" cy="20" r="18" fill="url(#glow)" />
  </g>
</svg>
